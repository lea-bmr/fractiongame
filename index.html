<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bruch-Battle – Die Ferien-Gameshow</title>
<style>
:root{--ink:#22314e;--muted:#61718b;--blue:#5267db;--pink:#f17e9b;--mint:#37ac91;--gold:#f4ae42;--bg:#f4f7ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Trebuchet MS',sans-serif;background:radial-gradient(ellipse at 15% 0%,#e4efff,transparent 40%),radial-gradient(ellipse at 90% 90%,#fce8f0,transparent 40%),var(--bg);color:var(--ink);min-height:100vh}.wrap{max-width:1250px;margin:auto;padding:18px 24px 36px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:clamp(25px,4vw,44px);margin:0;letter-spacing:-1.5px}h1 span{color:var(--blue)}.subtitle{color:var(--muted);font-size:15px;margin:4px 0 0}.pill{border:1px solid #d9e1f2;border-radius:16px;padding:9px 13px;background:white;font-weight:800;color:#596b9c}button{font:inherit;cursor:pointer;border:0}.reset{background:white;border:1px solid #d9e1f2;border-radius:14px;padding:11px 14px;color:var(--ink);font-weight:750}.reset:hover{background:#edf1fb}.scorebar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.team{background:white;border-radius:20px;box-shadow:0 6px 25px #42517c0e;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid transparent}.team:nth-child(1){border-color:#ffd3dd}.team:nth-child(2){border-color:#d8e0ff}.team:nth-child(3){border-color:#bcecdf}.team input{font-size:17px;font-weight:800;border:0;width:60%;min-width:50px;color:var(--ink);background:transparent;outline-offset:3px}.count{font-size:27px;font-weight:900;font-variant-numeric:tabular-nums}.board{background:white;border-radius:26px;padding:20px;box-shadow:0 15px 45px #536a9915}.boardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.boardhead h2{margin:0;font-size:21px}.boardhead small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.cat{padding:15px 8px;border-radius:14px;text-align:center;color:white;font-weight:900;font-size:clamp(13px,1.5vw,19px);min-height:67px;display:grid;place-items:center}.cat:nth-child(1){background:#5c77db}.cat:nth-child(2){background:#ee8ba1}.cat:nth-child(3){background:#2daa96}.cat:nth-child(4){background:#e7a240}.tile{height:88px;border-radius:15px;font-size:30px;font-weight:900;background:#edf1ff;color:#465fd3;transition:.13s;box-shadow:inset 0 -4px #dce4fa}.tile:hover:not(:disabled){transform:translateY(-3px);background:#dce7ff}.tile:disabled{background:#f4f5f8;color:#b9c0cd;box-shadow:none;cursor:default}.foot{margin-top:13px;text-align:center;color:#76839b;font-size:13px}.overlay{position:fixed;inset:0;z-index:9;background:#1a2546b3;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}.hide{display:none!important}.modal{width:min(800px,100%);background:white;border-radius:27px;padding:24px 30px 26px;box-shadow:0 25px 100px #080f2c60;position:relative;text-align:center}.close{position:absolute;right:18px;top:14px;background:#f1f4fa;border-radius:50%;width:38px;height:38px;font-size:23px;color:#526079}.eyebrow{font-weight:850;color:#6278d6;font-size:14px;text-transform:uppercase;letter-spacing:1.3px}.modal h2{font-size:clamp(23px,4vw,34px);margin:10px 10px}.visual{min-height:125px;display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;margin:12px 0 16px}.visual svg{max-width:100%;height:auto}.question{font-size:clamp(19px,2.5vw,27px);font-weight:750;line-height:1.45;margin:12px auto 17px}.answer{background:#eaf9f2;border:2px solid #c6eddd;border-radius:18px;padding:15px;font-size:clamp(19px,3vw,28px);font-weight:900;color:#167e66;margin:14px 0}.explain{font-size:15px;color:#3b7569;font-weight:500;margin-top:7px}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:17px}.primary{background:#5267db;color:white;padding:13px 22px;border-radius:14px;font-weight:850;font-size:17px}.secondary{background:#eaf0ff;color:#455cc5;padding:13px 19px;border-radius:14px;font-weight:850}.award{background:#f6f8fd;padding:13px;border-radius:19px;margin-top:17px}.award label{display:block;margin-bottom:11px;font-weight:800}.awardbuttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.awardbuttons button{padding:11px 16px;border-radius:13px;color:#fff;font-weight:800}.awardbuttons button:nth-child(1){background:#e47791}.awardbuttons button:nth-child(2){background:#6278d6}.awardbuttons button:nth-child(3){background:#29ab91}.noaward{background:white!important;color:#58657b!important;border:1px solid #d9e1ef!important}.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.07;font-weight:850;font-size:1.2em;margin:0 .15em}.frac .top{border-bottom:2.6px solid currentColor;padding:0 .16em .07em}.frac .bot{padding:.08em .16em 0}.intro{background:#eff4ff;border-radius:16px;padding:12px 17px;margin:14px 0;color:#52617a;font-size:15px;text-align:left}.footeract{display:flex;justify-content:center;margin:16px}.winner{font-size:30px;font-weight:900} @media(max-width:650px){.wrap{padding:12px}.grid{gap:6px}.cat{font-size:12px;min-height:55px;padding:6px 3px}.tile{height:68px;font-size:22px}.scorebar{gap:6px}.team{padding:9px 6px;display:block;text-align:center}.team input{width:95%;font-size:13px;text-align:center}.count{font-size:23px}.modal{padding:19px 13px}.board{padding:11px}.subtitle{font-size:12px}header .pill{display:none}}
</style></head><body>
<div class="wrap"><header><div><h1>🥳 <span>Bruch-Battle</span></h1><p class="subtitle">Die große Ferien-Gameshow · Klasse 6</p></div><div class="pill">🎯 4 Kategorien · 20 Aufgaben</div></header>
<div class="scorebar" id="scores"></div>
<section class="board"><div class="boardhead"><div><h2>Wählt ein Feld!</h2><small>Je mehr Punkte, desto kniffliger die Aufgabe.</small></div><button class="reset" id="reset">↻ Neustart</button></div><div class="grid" id="grid"></div><div class="foot">Tipp: Die Teams beraten leise, dann wird aufgelöst. Punkte vergibst du nach der Lösung.</div></section>
<div class="footeract"><button class="reset" id="rules">📘 Spielregeln</button></div></div>
<div class="overlay hide" id="overlay" role="dialog" aria-modal="true"><div class="modal"><button class="close" id="close" aria-label="Schließen">×</button><div class="eyebrow" id="eyebrow"></div><h2 id="heading"></h2><div class="visual" id="visual"></div><div class="question" id="question"></div><div class="answer hide" id="answer"></div><div class="actions" id="actions"><button class="primary" id="reveal">💡 Lösung zeigen</button></div><div class="award hide" id="award"><label>Welches Team bekommt die Punkte?</label><div class="awardbuttons" id="awardbuttons"></div></div></div></div>
<script>
const F=(a,b)=>`<span class="frac"><span class="top">${a}</span><span class="bot">${b}</span></span>`;
const pie=(n,d,shape='circle')=>{let w=190,h=165,svg='';if(shape==='bar'){let x=8,y=38,bw=174/d;for(let i=0;i<d;i++)svg+=`<rect x="${x+i*bw}" y="${y}" width="${bw}" height="75" fill="${i<n?'#647bdf':'#e8edfa'}" stroke="white" stroke-width="3"/>`;svg+=`<rect x="8" y="38" width="174" height="75" fill="none" stroke="#364875" stroke-width="2"/>`;}else{for(let i=0;i<d;i++){let a=-Math.PI/2+i*2*Math.PI/d,b=a+2*Math.PI/d;if(d===1){svg+=`<circle cx="95" cy="83" r="75" fill="${n?'#647bdf':'#e8edfa'}" stroke="white" stroke-width="2"/>`;continue;}let x1=95+75*Math.cos(a),y1=83+75*Math.sin(a),x2=95+75*Math.cos(b),y2=83+75*Math.sin(b);svg+=`<path d="M95 83 L${x1} ${y1} A75 75 0 ${2*Math.PI/d>Math.PI?1:0} 1 ${x2} ${y2} Z" fill="${i<n?'#647bdf':'#e8edfa'}" stroke="white" stroke-width="2"/>`;}svg+=`<circle cx="95" cy="83" r="75" stroke="#364875" stroke-width="2" fill="none"/>`;}return `<svg viewBox="0 0 ${w} ${h}" width="220" role="img" aria-label="${n} von ${d} Teilen eingefärbt">${svg}</svg>`};
const q=(question,answer,visual='',explain='')=>({question,answer,visual,explain});
const data=[
[ q('Welcher Bruchteil ist blau?',F(1,2),pie(1,2)),q('Welcher Bruchteil ist blau?',F(3,4),pie(3,4)),q('Welcher Bruchteil ist blau?',F(2,5),pie(2,5,'bar')),q('Nenne den blauen Anteil. Gibt es noch eine andere Schreibweise?',`${F(4,8)} = ${F(1,2)}`,pie(4,8,'bar'),'Vier von acht gleichen Teilen sind die Hälfte.'),q('Zwei von drei gleich großen Pizzen sind jeweils zur Hälfte gegessen. Wie viele ganze Pizzen sind zusammen gegessen?',`1 ganze Pizza`,pie(1,2)+pie(1,2),'Zwei Hälften ergeben ein Ganzes.') ],
[ q(`Was ist größer: ${F(1,2)} oder ${F(1,4)}?`,F(1,2),'','Bei gleich großen Ganzen ist eine Hälfte größer als ein Viertel.'),q(`Welcher Bruch ist größer: ${F(3,5)} oder ${F(1,5)}?`,F(3,5),'','Bei gleichem Nenner ist der größere Zähler entscheidend.'),q(`Ordne von klein nach groß: ${F(1,2)}, ${F(1,4)}, ${F(3,4)}.`,`${F(1,4)} < ${F(1,2)} < ${F(3,4)}`),q(`Was ist größer: ${F(2,3)} oder ${F(3,4)}?`,F(3,4),'',`${F(2,3)} = ${F(8,12)} und ${F(3,4)} = ${F(9,12)}.`),q(`Wahr oder falsch? ${F(4,8)} ist größer als ${F(3,6)}.`,`Falsch! Beide sind ${F(1,2)}.`)],
[ q(`Ergänze: ${F(1,2)} = ${F('?',4)}`,F(2,4)),q(`Ergänze: ${F(2,3)} = ${F('?',6)}`,F(4,6)),q(`Ist ${F(3,6)} gleich viel wie ${F(1,2)}?`,'Ja! Beide zeigen die Hälfte.',pie(3,6)+pie(1,2)),q(`Kürze ${F(6,8)} so weit wie möglich.`,F(3,4),'','Zähler und Nenner durch 2 teilen.'),q(`Finde zwei verschiedene Brüche, die genauso viel sind wie ${F(2,5)}.`,`${F(4,10)} und ${F(6,15)}`,'','Andere richtige Beispiele zählen ebenfalls.') ],
[ q(`Ein Kuchen hat 4 gleich große Stücke. Mia isst 1 Stück. Welchen Anteil isst sie?`,F(1,4)),q(`Ein Schokoriegel hat 8 gleich große Stücke. Du isst 4. Wie viel ist das?`,`${F(4,8)} = ${F(1,2)}`),q(`In einer Klasse sind 20 Kinder. ${F(1,4)} davon fährt mit dem Fahrrad. Wie viele sind das?`,'5 Kinder','','20 : 4 = 5'),q(`Eine Pizza hat 12 gleich große Stücke. Du isst ${F(2,3)} davon. Wie viele Stücke sind das?`,'8 Stücke','','12 : 3 · 2 = 8'),q(`Von 24 Bonbons bekommt Tim ${F(3,8)}. Wie viele Bonbons erhält er?`,'9 Bonbons','','24 : 8 · 3 = 9')]
];
const cats=['🧩 Brüche erkennen','⚖️ Vergleichen','✨ Gleich viel!','🍕 Brüche im Alltag'], points=[100,200,300,400,500];let scores=[0,0,0],names=['Team Rot','Team Blau','Team Grün'],done=new Set(),current=null,revealed=false;
function renderScores(){document.getElementById('scores').innerHTML=scores.map((s,i)=>`<div class="team"><input aria-label="Name Team ${i+1}" maxlength="18" data-team="${i}" value="${names[i].replaceAll('"','&quot;')}"><span class="count">${s}</span></div>`).join('');document.querySelectorAll('.team input').forEach(el=>el.addEventListener('change',e=>names[+e.target.dataset.team]=e.target.value.trim()||`Team ${+e.target.dataset.team+1}`))}
function renderBoard(){let html=cats.map(c=>`<div class="cat">${c}</div>`).join('');for(let row=0;row<5;row++)for(let col=0;col<4;col++){let key=col+'-'+row;html+=`<button class="tile" data-col="${col}" data-row="${row}" ${done.has(key)?'disabled':''}>${done.has(key)?'✓':points[row]}</button>`;}document.getElementById('grid').innerHTML=html;document.querySelectorAll('.tile:not(:disabled)').forEach(b=>b.addEventListener('click',()=>openQuestion(+b.dataset.col,+b.dataset.row)))}
const overlay=document.getElementById('overlay');function openQuestion(col,row){current={col,row};revealed=false;let item=data[col][row];document.getElementById('eyebrow').textContent=cats[col]+' · '+points[row]+' Punkte';document.getElementById('heading').textContent='Eure Aufgabe';document.getElementById('visual').innerHTML=item.visual||'';document.getElementById('question').innerHTML=item.question;document.getElementById('answer').classList.add('hide');document.getElementById('award').classList.add('hide');document.getElementById('actions').classList.remove('hide');document.getElementById('reveal').classList.remove('hide');overlay.classList.remove('hide')}
function reveal(){if(!current)return;let {col,row}=current,item=data[col][row];revealed=true;document.getElementById('answer').innerHTML=item.answer+(item.explain?`<div class="explain">${item.explain}</div>`:'');document.getElementById('answer').classList.remove('hide');document.getElementById('award').classList.remove('hide');document.getElementById('reveal').classList.add('hide');document.getElementById('awardbuttons').innerHTML=names.map((n,i)=>`<button data-team="${i}">+${points[row]} · ${n.replaceAll('<','&lt;')}</button>`).join('')+`<button class="noaward" data-team="-1">Niemand</button>`;document.querySelectorAll('#awardbuttons button').forEach(btn=>btn.onclick=()=>award(+btn.dataset.team))}
function award(team){if(!current)return;let key=current.col+'-'+current.row;if(team>=0)scores[team]+=points[current.row];done.add(key);current=null;overlay.classList.add('hide');renderScores();renderBoard();if(done.size===20){setTimeout(()=>{let high=Math.max(...scores);let winners=names.filter((_,i)=>scores[i]===high);document.getElementById('eyebrow').textContent='🏆 Das Battle ist vorbei!';document.getElementById('heading').textContent='Geschafft!';document.getElementById('visual').innerHTML='🎉';document.getElementById('question').innerHTML=`<div class="winner">${winners.join(' & ')} ${winners.length>1?'gewinnen!':'gewinnt!'}</div>`;document.getElementById('answer').classList.add('hide');document.getElementById('actions').classList.add('hide');document.getElementById('award').classList.add('hide');overlay.classList.remove('hide')},300)}}
function closeModal(){overlay.classList.add('hide');if(current&&revealed){done.add(current.col+'-'+current.row);current=null;renderBoard()}}
document.getElementById('reveal').onclick=reveal;document.getElementById('close').onclick=closeModal;overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.getElementById('reset').onclick=()=>{if(!confirm('Spielstand und alle verwendeten Felder zurücksetzen?'))return;scores=[0,0,0];done.clear();current=null;renderScores();renderBoard()};document.getElementById('rules').onclick=()=>{current=null;document.getElementById('eyebrow').textContent='So wird gespielt';document.getElementById('heading').textContent='📘 Spielregeln';document.getElementById('visual').innerHTML='';document.getElementById('question').innerHTML='<div class="intro">Bildet bis zu drei Teams und benennt sie oben um.<br><br>Ein Team wählt eine Kategorie und einen Punktewert. Lies die Aufgabe vor und gib allen eine kurze Denkzeit. Das Team nennt seine Antwort – dann klickst du auf <b>„Lösung zeigen“</b>.<br><br>Vergib die Punkte an das richtige Team oder wähle <b>„Niemand“</b>. Ein bereits gespieltes Feld verschwindet vom Spielbrett. Wer am Ende die meisten Punkte hat, gewinnt!<br><br><b>Leicht anfangen:</b> 100 Punkte · <b>Extra knifflig:</b> 500 Punkte.</div>';document.getElementById('answer').classList.add('hide');document.getElementById('actions').classList.add('hide');document.getElementById('award').classList.add('hide');overlay.classList.remove('hide')};renderScores();renderBoard();
</script></body></html>
