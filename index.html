<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bruch-Battle – Die Ferien-Gameshow</title>
<style>
:root{--ink:#22314e;--muted:#61718b;--blue:#5267db;--pink:#f17e9b;--mint:#37ac91;--gold:#f4ae42;--bg:#f4f7ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Trebuchet MS',sans-serif;background:radial-gradient(ellipse at 15% 0%,#e4efff,transparent 40%),radial-gradient(ellipse at 90% 90%,#fce8f0,transparent 40%),var(--bg);color:var(--ink);min-height:100vh}.wrap{max-width:1250px;margin:auto;padding:18px 24px 36px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:clamp(25px,4vw,44px);margin:0;letter-spacing:-1.5px}h1 span{color:var(--blue)}.subtitle{color:var(--muted);font-size:15px;margin:4px 0 0}.pill{border:1px solid #d9e1f2;border-radius:16px;padding:9px 13px;background:white;font-weight:800;color:#596b9c}button{font:inherit;cursor:pointer;border:0}.reset{background:white;border:1px solid #d9e1f2;border-radius:14px;padding:11px 14px;color:var(--ink);font-weight:750}.reset:hover{background:#edf1fb}.scorebar{display:grid;grid-template-columns:1fr;gap:12px;margin:22px 0}.team{background:white;border-radius:20px;box-shadow:0 6px 25px #42517c0e;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid transparent}.team:nth-child(1){border-color:#d8e0ff}.team:nth-child(2){border-color:#d8e0ff}.team:nth-child(3){border-color:#bcecdf}.team input{font-size:17px;font-weight:800;border:0;width:60%;min-width:50px;color:var(--ink);background:transparent;outline-offset:3px}.count{font-size:27px;font-weight:900;font-variant-numeric:tabular-nums}.board{background:white;border-radius:26px;padding:20px;box-shadow:0 15px 45px #536a9915}.boardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.boardhead h2{margin:0;font-size:21px}.boardhead small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.cat{padding:15px 8px;border-radius:14px;text-align:center;color:white;font-weight:900;font-size:clamp(13px,1.5vw,19px);min-height:67px;display:grid;place-items:center}.cat:nth-child(1){background:#5c77db}.cat:nth-child(2){background:#ee8ba1}.cat:nth-child(3){background:#2daa96}.cat:nth-child(4){background:#e7a240}.tile{height:88px;border-radius:15px;font-size:30px;font-weight:900;background:#edf1ff;color:#465fd3;transition:.13s;box-shadow:inset 0 -4px #dce4fa}.tile:hover:not(:disabled){transform:translateY(-3px);background:#dce7ff}.tile:disabled{background:#f4f5f8;color:#b9c0cd;box-shadow:none;cursor:default}.foot{margin-top:13px;text-align:center;color:#76839b;font-size:13px}.overlay{position:fixed;inset:0;z-index:9;background:#1a2546b3;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}.hide{display:none!important}.modal{width:min(800px,100%);background:white;border-radius:27px;padding:24px 30px 26px;box-shadow:0 25px 100px #080f2c60;position:relative;text-align:center}.close{position:absolute;right:18px;top:14px;background:#f1f4fa;border-radius:50%;width:38px;height:38px;font-size:23px;color:#526079}.eyebrow{font-weight:850;color:#6278d6;font-size:14px;text-transform:uppercase;letter-spacing:1.3px}.modal h2{font-size:clamp(23px,4vw,34px);margin:10px 10px}.visual{min-height:125px;display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;margin:12px 0 16px}.visual svg{max-width:100%;height:auto}.question{font-size:clamp(19px,2.5vw,27px);font-weight:750;line-height:1.45;margin:12px auto 17px}.answer{background:#eaf9f2;border:2px solid #c6eddd;border-radius:18px;padding:15px;font-size:clamp(19px,3vw,28px);font-weight:900;color:#167e66;margin:14px 0}.explain{font-size:15px;color:#3b7569;font-weight:500;margin-top:7px}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:17px}.primary{background:#5267db;color:white;padding:13px 22px;border-radius:14px;font-weight:850;font-size:17px}.secondary{background:#eaf0ff;color:#455cc5;padding:13px 19px;border-radius:14px;font-weight:850}.award{background:#f6f8fd;padding:13px;border-radius:19px;margin-top:17px}.award label{display:block;margin-bottom:11px;font-weight:800}.awardbuttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.awardbuttons button{padding:11px 16px;border-radius:13px;color:#fff;font-weight:800}.awardbuttons button:nth-child(1){background:#e47791}.awardbuttons button:nth-child(2){background:#6278d6}.awardbuttons button:nth-child(3){background:#29ab91}.noaward{background:white!important;color:#58657b!important;border:1px solid #d9e1ef!important}.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.07;font-weight:850;font-size:1.2em;margin:0 .15em}.frac .top{border-bottom:2.6px solid currentColor;padding:0 .16em .07em}.frac .bot{padding:.08em .16em 0}.intro{background:#eff4ff;border-radius:16px;padding:12px 17px;margin:14px 0;color:#52617a;font-size:15px;text-align:left}.footeract{display:flex;justify-content:center;margin:16px}.winner{font-size:30px;font-weight:900} @media(max-width:650px){.wrap{padding:12px}.grid{gap:6px}.cat{font-size:12px;min-height:55px;padding:6px 3px}.tile{height:68px;font-size:22px}.scorebar{gap:6px}.team{padding:9px 6px;display:block;text-align:center}.team input{width:95%;font-size:13px;text-align:center}.count{font-size:23px}.modal{padding:19px 13px}.board{padding:11px}.subtitle{font-size:12px}header .pill{display:none}}
.teaminfo{font-size:13px;color:#66738b}.teamleft{display:flex;flex-direction:column;gap:2px;flex:1}.team{align-items:center}.team .count{color:#5267db}.entry{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}.entry input{font:inherit;font-size:18px;border:2px solid #dce3fa;border-radius:13px;padding:12px 14px;width:min(380px,100%)}.entryhint{font-size:13px;font-weight:500;color:#65728a}.noaward{font-size:16px}.question{margin-bottom:12px}@media(max-width:650px){.team{display:flex;text-align:left;padding:12px}.team input{text-align:left}} </style></head><body>
<div class="wrap"><header><div><h1>🥳 <span>Bruch-Battle</span></h1><p class="subtitle">Die iPad-Teamchallenge · Klasse 6</p></div><div class="pill">🎯 4 Kategorien · 1–5 Punkte</div></header>
<div class="scorebar" id="scores"></div>
<section class="board"><div class="boardhead"><div><h2>Moderator: Wähle ein Feld!</h2><small>Je mehr Punkte, desto kniffliger die Aufgabe.</small></div><button class="reset" id="reset">↻ Neustart</button></div><div class="grid" id="grid"></div><div class="foot">3 Spieler denken erst selbst, beraten dann gemeinsam. Der Moderator deckt die Lösung auf und vergibt die Punkte.</div></section>
<div class="footeract"><button class="reset" id="rules">📘 Spielregeln</button></div></div>
<div class="overlay hide" id="overlay" role="dialog" aria-modal="true"><div class="modal"><button class="close" id="close" aria-label="Schließen">×</button><div class="eyebrow" id="eyebrow"></div><h2 id="heading"></h2><div class="visual" id="visual"></div><div class="question" id="question"></div><div class="answer hide" id="answer"></div><div class="actions" id="actions"><button class="primary" id="reveal">💡 Lösung zeigen</button></div><div class="award hide" id="award"><label>Moderator: War eure gemeinsame Antwort richtig?</label><div class="awardbuttons" id="awardbuttons"></div></div></div></div>
<script>
const F=(a,b)=>`<span class="frac"><span class="top">${a}</span><span class="bot">${b}</span></span>`;
const pie=(n,d,shape='circle')=>{let w=190,h=165,svg='';if(shape==='bar'){let x=8,y=38,bw=174/d;for(let i=0;i<d;i++)svg+=`<rect x="${x+i*bw}" y="${y}" width="${bw}" height="75" fill="${i<n?'#647bdf':'#e8edfa'}" stroke="white" stroke-width="3"/>`;svg+=`<rect x="8" y="38" width="174" height="75" fill="none" stroke="#364875" stroke-width="2"/>`;}else{for(let i=0;i<d;i++){let a=-Math.PI/2+i*2*Math.PI/d,b=a+2*Math.PI/d;if(d===1){svg+=`<circle cx="95" cy="83" r="75" fill="${n?'#647bdf':'#e8edfa'}" stroke="white" stroke-width="2"/>`;continue;}let x1=95+75*Math.cos(a),y1=83+75*Math.sin(a),x2=95+75*Math.cos(b),y2=83+75*Math.sin(b);svg+=`<path d="M95 83 L${x1} ${y1} A75 75 0 ${2*Math.PI/d>Math.PI?1:0} 1 ${x2} ${y2} Z" fill="${i<n?'#647bdf':'#e8edfa'}" stroke="white" stroke-width="2"/>`;}svg+=`<circle cx="95" cy="83" r="75" stroke="#364875" stroke-width="2" fill="none"/>`;}return `<svg viewBox="0 0 ${w} ${h}" width="220" role="img" aria-label="${n} von ${d} Teilen eingefärbt">${svg}</svg>`};
const q=(question,answer,visual='',explain='')=>({question,answer,visual,explain});
// Fünf Aufgaben pro Kategorie: steigende Schwierigkeit, ausschließlich Bruchteile und Gleichwertigkeit.
const data=[
[ q('Welcher Bruchteil ist blau?',F(1,2),pie(1,2)),
  q('Welcher Bruchteil ist blau?',F(3,4),pie(3,4)),
  q('Welcher Bruchteil ist blau?',F(2,5),pie(2,5,'bar')),
  q('Wie groß ist der blau gefärbte Anteil? Gib den Bruch vollständig gekürzt an.',F(1,2),pie(4,8,'bar'),'Vier Achtel sind genauso viel wie ein Halb.'),
  q('Welcher Bruchteil der beiden Kreise ist insgesamt blau? Antworte als Anzahl ganzer Kreise.','1 Ganzes',pie(1,2)+pie(2,4),'Eine Hälfte und zwei Viertel ergeben ein Ganzes.') ],
[ q(`Ein Kuchen besteht aus 4 gleich großen Stücken. 1 Stück wird gegessen. Welcher Bruchteil ist das?`,F(1,4),pie(1,4)),
  q(`Ein Streifen hat 6 gleiche Felder. 2 davon sind gefärbt. Gib den Anteil als Bruch an.`,F(2,6),pie(2,6,'bar')),
  q(`Von 12 Murmeln sind 3 blau. Welchen Bruchteil aller Murmeln machen die blauen aus?`,`${F(3,12)} = ${F(1,4)}`,'','Auch 3 Zwölftel ist richtig.'),
  q(`Von 20 Kindern hat ${F(1,4)} ein rotes T-Shirt. Wie viele Kinder sind das?`,'5 Kinder','','20 durch 4 ergibt 5.'),
  q(`Von 24 Karten sind ${F(3,8)} grün. Wie viele grüne Karten gibt es?`,'9 Karten','','24 durch 8, danach mal 3.') ],
[ q(`Ergänze den fehlenden Zähler: ${F(1,2)} = ${F('?',4)}`,'2'),
  q(`Ergänze den fehlenden Zähler: ${F(2,3)} = ${F('?',6)}`,'4'),
  q(`Sind ${F(3,6)} und ${F(1,2)} gleich groß?`,'Ja',pie(3,6)+pie(1,2),'Beide bedeuten die Hälfte.'),
  q(`Kürze ${F(6,8)} so weit wie möglich.`,F(3,4),'','Zähler und Nenner durch 2 teilen.'),
  q(`Ergänze den fehlenden Nenner: ${F(3,5)} = ${F(12,'?')}`,'20','','Der Zähler wurde vervierfacht. Der Nenner muss ebenfalls vervierfacht werden.') ],
[ q(`Profi-Check: Stimmt das? ${F(2,4)} = ${F(1,2)}`,'Ja',pie(2,4)+pie(1,2)),
  q(`Zwei Kinder essen jeweils ${F(1,4)} einer gleich großen Pizza. Welcher Bruchteil einer Pizza ist das zusammen?`,`${F(2,4)} = ${F(1,2)}`,'','Ein Viertel plus ein Viertel ist eine Hälfte.'),
  q(`Ein Drittel einer Klasse von 18 Kindern spielt Fußball. Wie viele Kinder sind das?`,'6 Kinder','','18 durch 3 ergibt 6.'),
  q(`Fehlerdetektiv: Alex sagt ${F(2,3)} = ${F(4,9)}. Hat Alex recht? Begründe.`,`Nein. ${F(2,3)} = ${F(6,9)}.`,'','Beim Erweitern müssen Zähler und Nenner mit derselben Zahl multipliziert werden.'),
  q(`Profi-Aufgabe: Von 30 Bonbons sind ${F(2,5)} rot. Wie viele Bonbons sind NICHT rot?`,'18 Bonbons','','Zwei Fünftel von 30 sind 12. Also sind 30 − 12 = 18 nicht rot.') ]
];
const cats=['🧩 Bruchteile erkennen','🍰 Bruchteile bestimmen','✨ Gleichwertigkeit','🏆 Profis'], points=[1,2,3,4,5];
let score=0,teamName='Unser Team',done=new Set(),current=null,revealed=false,round=0;
const $=id=>document.getElementById(id);
function escapeHtml(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function renderScores(){
 $('scores').innerHTML=`<div class="team"><div class="teamleft"><input aria-label="Teamname" id="teamname" maxlength="28" value="${escapeHtml(teamName)}"><div class="teaminfo">🎤 1 Moderator + 🧠 3 Spieler · nach 4 Aufgaben Rollen tauschen · Runde ${round+1}</div></div><span class="count">⭐ ${score} P.</span></div>`;
 $('teamname').addEventListener('input',e=>teamName=e.target.value);
}
function renderBoard(){let html=cats.map(c=>`<div class="cat">${c}</div>`).join('');for(let row=0;row<5;row++)for(let col=0;col<4;col++){let key=col+'-'+row;html+=`<button class="tile" data-col="${col}" data-row="${row}" ${done.has(key)?'disabled':''}>${done.has(key)?'✓':points[row]}</button>`;}$('grid').innerHTML=html;document.querySelectorAll('.tile:not(:disabled)').forEach(b=>b.addEventListener('click',()=>openQuestion(+b.dataset.col,+b.dataset.row)))}
const overlay=$('overlay');
function openQuestion(col,row){current={col,row};revealed=false;let item=data[col][row];$('eyebrow').textContent=cats[col]+' · '+points[row]+' '+(points[row]===1?'Punkt':'Punkte');$('heading').textContent='Eure Aufgabe';$('visual').innerHTML=item.visual||'';$('question').innerHTML=item.question+`<div class="entryhint">Alle drei Spieler überlegen zuerst. Beratet euch, bevor der Moderator die Lösung aufdeckt.</div>`;$('answer').classList.add('hide');$('award').classList.add('hide');$('actions').classList.remove('hide');$('reveal').classList.remove('hide');overlay.classList.remove('hide')}
function reveal(){if(!current)return;let {col,row}=current,item=data[col][row];revealed=true;$('answer').innerHTML=item.answer+(item.explain?`<div class="explain">${item.explain}</div>`:'');$('answer').classList.remove('hide');$('award').classList.remove('hide');$('reveal').classList.add('hide');$('awardbuttons').innerHTML=`<button data-correct="1">✓ Richtig · +${points[row]} ${points[row]===1?'Punkt':'Punkte'}</button><button class="noaward" data-correct="0">✗ Noch nicht richtig · +0</button>`;document.querySelectorAll('#awardbuttons button').forEach(btn=>btn.onclick=()=>award(btn.dataset.correct==='1'))}
function award(correct){if(!current)return;let key=current.col+'-'+current.row;if(correct)score+=points[current.row];done.add(key);current=null;overlay.classList.add('hide');round=Math.floor(done.size/4);renderScores();renderBoard();if(done.size===20){setTimeout(()=>{ $('eyebrow').textContent='🏆 Das Battle ist vorbei!';$('heading').textContent='Geschafft!';$('visual').innerHTML='🎉';$('question').innerHTML=`<div class="winner">${escapeHtml(teamName||'Euer Team')}: ${score} von 60 Punkten!</div>`;$('answer').classList.add('hide');$('actions').classList.add('hide');$('award').classList.add('hide');overlay.classList.remove('hide')},200)}else if(done.size%4===0){setTimeout(()=>{ $('eyebrow').textContent='🔄 Rollenwechsel';$('heading').textContent='Neue Moderation!';$('visual').innerHTML='🎤';$('question').innerHTML='Ihr habt 4 Aufgaben geschafft. Wechselt jetzt die Rollen, damit jemand anderes das iPad moderiert.';$('answer').classList.add('hide');$('actions').classList.add('hide');$('award').classList.add('hide');overlay.classList.remove('hide')},150)}}
function closeModal(){overlay.classList.add('hide');if(current&&revealed){/* Ein Feld wird erst nach der Punktevergabe abgeschlossen. */}}
$('reveal').onclick=reveal;$('close').onclick=closeModal;overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('reset').onclick=()=>{if(!confirm('Punktestand und alle erledigten Aufgaben zurücksetzen?'))return;score=0;done.clear();current=null;round=0;renderScores();renderBoard()};
$('rules').onclick=()=>{current=null;$('eyebrow').textContent='So wird gespielt';$('heading').textContent='📘 Spielregeln';$('visual').innerHTML='';$('question').innerHTML='<div class="intro"><b>1 iPad pro Team:</b> Drei Spieler und ein Moderator. Bei 30 Kindern sind zum Beispiel sechs Viererteams und zwei Dreierteams möglich.<br><br><b>Moderator:</b> Wähle eine Kategorie und 1 bis 5 Punkte. Lies die Aufgabe vor. Alle Spieler denken erst selbst, vergleichen dann ihre Lösungen und erklären ihre Überlegungen.<br><br>Decke die Lösung auf und entscheide fair: <b>Richtig</b> gibt die angezeigten Punkte, <b>Noch nicht richtig</b> gibt 0 Punkte.<br><br><b>Rollenwechsel:</b> Nach vier Aufgaben übernimmt ein anderes Kind die Moderation.<br><br>Jedes Team spielt selbstständig auf seinem iPad. Es gibt 20 Aufgaben mit insgesamt maximal 60 Punkten. <b>Profis</b> ist die Bonuskategorie mit gemischten Herausforderungen.</div>';$('answer').classList.add('hide');$('actions').classList.add('hide');$('award').classList.add('hide');overlay.classList.remove('hide')};
renderScores();renderBoard();
</script></body></html>
